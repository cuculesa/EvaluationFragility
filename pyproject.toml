[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "evalfrag"
version = "1.0.0"
description = "Production-grade Inspect AI harness for measuring prompt, decoding, and answer-extraction sensitivity."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "EvalFrag contributors" }]
dependencies = [
  "inspect-ai==0.3.251",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "mypy>=1.16,<2",
]
openai = ["openai>=1.97,<2"]

[project.scripts]
evalfrag = "evalfrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["evalfrag*"]

[tool.setuptools.package-data]
evalfrag = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
packages = ["evalfrag"]
